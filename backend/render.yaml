services:
  # Django Web Service
  - type: web
    name: tzwellness-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tzwellness-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tzwellness-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

  # Celery Worker
  - type: worker
    name: tzwellness-celery-worker
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tzwellness-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tzwellness-redis
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

  # Celery Beat Scheduler
  - type: worker
    name: tzwellness-celery-beat
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tzwellness-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tzwellness-redis
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

databases:
  - name: tzwellness-db
    databaseName: tzwellness
    user: tzwellness
    region: oregon
    plan: free

services:
  - type: redis
    name: tzwellness-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
